version: '3.8'
services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/artifacts:ro
      - ./data:/data:ro

  frontend:
    build:
      context: ./frontend
    environment:
      - VITE_BACKEND_HTTP=http://host.docker.internal:8000
      - VITE_BACKEND_WS=ws://host.docker.internal:8000/ws/alerts
    ports:
      - "5173:5173"
    depends_on:
      - backend

  ai_threat_visor:
    build:
      context: ./ai_threat_visor
    environment:
      - VITE_BACKEND_HTTP=http://host.docker.internal:8000
      - VITE_BACKEND_WS=ws://host.docker.internal:8000/ws/alerts
    ports:
      - "3000:3000"
    depends_on:
      - backend
