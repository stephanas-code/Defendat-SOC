apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: protect-ai-ids-internal-stores
  namespace: ai-ids-system
spec:
  podSelector:
    matchLabels:
      app: timescaledb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ai-ids-backend
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: protect-ai-ids-redis-kafka
  namespace: ai-ids-system
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["redis", "kafka", "zookeeper"]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-ids-system
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-ids-soc-ingress
  namespace: ai-ids-system
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"
    nginx.ingress.kubernetes.io/limit-rps: "50"
spec:
  ingressClassName: nginx
  rules:
    - host: soc.security.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-threat-visor
                port:
                  number: 3000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ai-ids-backend
                port:
                  number: 8000
