apiVersion: v1
kind: Namespace
metadata:
  name: ai-ids-system
  labels:
    app.kubernetes.io/part-of: ai-anomaly-ids-idp
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-ids-backend-sa
  namespace: ai-ids-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-ids-node-agent-sa
  namespace: ai-ids-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-ids-cluster-auditor
rules:
  # Read-only discovery across cluster resources (never deletes or modifies existing workloads)
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods", "services", "endpoints", "events", "serviceaccounts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["Rbac.authorization.k8s.io", "rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["get", "list", "watch"]
  # Scoped NetworkPolicy management for quarantine isolation of confirmed compromised pods
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-ids-cluster-auditor-binding
subjects:
  - kind: ServiceAccount
    name: ai-ids-backend-sa
    namespace: ai-ids-system
roleRef:
  kind: ClusterRole
  name: ai-ids-cluster-auditor
  apiGroup: rbac.authorization.k8s.io
