apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ai-ids-node-agent
  namespace: ai-ids-system
  labels:
    app: ai-ids-node-agent
spec:
  selector:
    matchLabels:
      app: ai-ids-node-agent
  template:
    metadata:
      labels:
        app: ai-ids-node-agent
    spec:
      serviceAccountName: ai-ids-node-agent-sa
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      containers:
        - name: sensor
          image: ai-anomaly-ids-idp-sensor:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ai-ids-config
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_RAW", "NET_ADMIN"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
        - name: responder
          image: ai-anomaly-ids-idp-responder:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ai-ids-config
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN", "NET_RAW"]
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
